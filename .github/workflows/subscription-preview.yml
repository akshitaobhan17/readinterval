name: Subscription preview checks

on:
  push:
    branches: [subscriptions-preview]
  pull_request:
    branches: [subscriptions-preview]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: interval
          POSTGRES_PASSWORD: interval_test
          POSTGRES_DB: interval_preview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interval -d interval_preview_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://interval:interval_test@localhost:5432/interval_preview_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm install
      - name: Apply clean-database migrations
        run: |
          set -e
          for migration in api/_lib/migrations/00*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run unit tests
        run: npm test
